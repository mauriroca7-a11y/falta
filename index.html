<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FALTA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0d14'/%3E%3Ctext x='50' y='66' font-size='56' text-anchor='middle'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d14;--card:#151826;--card2:#1c2033;--txt:#f2f4ff;--mut:#8b91ad;--acc:#ff5a3c;--ok:#35d07f;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 8px}
h1{margin:0;font-size:26px;letter-spacing:3px;font-weight:900}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin:0 4px 14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.iconbtn{background:var(--card);border-radius:12px;padding:9px 12px;font-size:18px}
.banner{background:var(--card2);border:1px dashed #394066;border-radius:14px;padding:12px 14px;font-size:13px;color:var(--mut);margin-bottom:14px;display:none}
.banner b{color:var(--txt)}
.banner button{margin-top:8px;background:var(--acc);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid #22273d}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--acc))}
.top{display:flex;align-items:center;gap:10px}
.emoji{font-size:30px}
.name{font-weight:800;font-size:18px;flex:1;word-break:break-word}
.when{color:var(--mut);font-size:12px;margin:2px 0 12px 40px}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.u{background:var(--card2);border-radius:14px;padding:10px 2px}
.u b{display:block;font-size:30px;font-variant-numeric:tabular-nums;font-weight:800;line-height:1.1}
.u small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.card.big .u b{font-size:38px}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--acc));width:0;transition:width .5s}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;background:var(--card2);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600}
.acts button.on{background:var(--c,var(--acc));color:#fff}
.done .u b{color:var(--ok)}
.done .clock{opacity:.9}
.badge{display:inline-block;background:var(--ok);color:#06210f;font-weight:800;font-size:12px;border-radius:99px;padding:3px 10px;margin-left:40px;margin-bottom:8px}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.empty .e{font-size:60px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;width:62px;height:62px;border-radius:50%;font-size:32px;box-shadow:0 8px 24px #ff5a3c66}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.panel h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
input{width:100%;background:var(--card2);border:1px solid #2b3150;color:var(--txt);border-radius:12px;padding:13px;font:inherit;font-size:16px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.tabs{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:4px}
.tabs button{flex:1;background:none;padding:10px;border-radius:9px;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:var(--card2);border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px}
.emojis button{font-size:24px;padding:6px 9px}
.emojis button.on,.colors button.on{outline:2px solid var(--txt)}
.colors button{width:34px;height:34px;border-radius:50%;padding:0}
.save{width:100%;background:var(--acc);color:#fff;border-radius:14px;padding:15px;font-weight:800;font-size:16px;margin-top:18px}
.cancel{width:100%;background:none;color:var(--mut);padding:12px;margin-top:4px}

.install{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:var(--card2);border:1px solid #394066;border-radius:18px;padding:14px;z-index:20;box-shadow:0 10px 30px #000a;display:none;overflow:hidden}
.install.show{display:block;animation:dn .35s ease}
@keyframes dn{from{transform:translateY(-120%)}to{transform:none}}
.install p{margin:0 0 10px;font-weight:700}
.install .r{display:flex;gap:8px}
.install .r button{flex:1;border-radius:12px;padding:11px;font-weight:800}
#insYes{background:var(--acc);color:#fff}
#insNo{background:var(--card);color:var(--mut)}
.install .t{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:100%}

.card{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card) 75%)}
.card>*:not(.bgimg){position:relative;z-index:1}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28;filter:saturate(1.1)}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--card) 0%,transparent 90%)}
.thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;border:2px solid var(--c)}
.u{background:color-mix(in srgb,var(--c) 16%,var(--card2))}
.imgpick{margin-top:10px}
#btnImg{width:100%;background:var(--card2);border:1px dashed #394066;border-radius:12px;padding:13px;font-weight:700}
#imgPrev{align-items:center;gap:12px;margin-top:10px}
#imgThumb{width:64px;height:64px;border-radius:16px;object-fit:cover;border:2px solid var(--acc)}
#btnImgX{background:var(--card2);border-radius:10px;padding:9px 14px;color:var(--mut);font-weight:700}
.pipv{position:fixed;left:-9999px;top:0;width:320px;height:180px}
.hbtns{display:flex;gap:8px}
.alarmbar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:#d3202a;border-radius:16px;padding:12px 14px;z-index:40;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px #000a;animation:pulse 1s infinite}
.alarmbar.show{display:flex}
.alarmbar span{flex:1;font-weight:800;font-size:15px}
.alarmbar button{background:#fff;color:#d3202a;border-radius:12px;padding:11px 16px;font-weight:900}
@keyframes pulse{50%{filter:brightness(1.25)}}
.sndrow{display:flex;gap:8px}
.sndrow button{background:var(--card2);border-radius:12px;padding:12px;font-weight:700}
#btnSnd{flex:1}
.hint{color:var(--mut);font-size:13px;margin-top:6px;word-break:break-word}
details.arch{margin-top:6px}
details.arch summary{color:var(--mut);font-weight:700;padding:10px 4px;cursor:pointer}
.mini{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--c)}
.mini .thumb{width:34px;height:34px;border-radius:10px}
.mini .mn{flex:1;min-width:0}
.mini .mn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mn small{color:var(--mut)}
.mini button{background:var(--card2);border-radius:10px;padding:9px 11px;font-size:16px}
</style>
</style>
</head>
<body>

<header>
  <h1>FAL<span>TA</span></h1>
  <div class="hbtns"><button class="iconbtn" id="btnFloatAll" title="Flotar todos">🪟</button><button class="iconbtn" id="btnBell" title="Notificaciones">🔔</button></div>
</header>
<p class="sub">¿Cuánto falta para lo que importa?</p>

<div class="banner" id="banner">
  <b>Activa las notificaciones</b> para ver el conteo en la barra de tu celular y recibir el aviso cuando llegue la hora.
  <br><button id="btnPerm">Activar notificaciones</button>
</div>

<div id="list"></div>

<div class="install" id="install"><p>📲 ¿Instalar FALTA en tu celular?</p><div class="r"><button id="insYes">Instalar</button><button id="insNo">Rechazar</button></div><div class="t" id="insBar"></div></div>

<video id="pipv" class="pipv" muted playsinline></video>
<div class="alarmbar" id="alarmBar"><span id="alarmTxt"></span><button id="alarmStop">Parar</button></div>

<button class="fab" id="fab">+</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 id="sheetTitle">Nueva cuenta regresiva</h2>

    <label>¿Qué es?</label>
    <input id="fName" placeholder="Ej: Entregar pedido, Estreno película…" maxlength="60">

    <label>Cuándo</label>
    <div class="tabs">
      <button id="tabDate" class="on">📅 Fecha y hora</button>
      <button id="tabDur">⏱ Duración</button>
    </div>

    <div id="boxDate">
      <div class="row" style="margin-top:8px">
        <input type="date" id="fDate">
        <input type="time" id="fTime" value="09:00">
      </div>
    </div>

    <div id="boxDur" style="display:none">
      <div class="row" style="margin-top:8px">
        <div><label style="margin-top:0">Días</label><input type="number" id="dD" min="0" value="0" inputmode="numeric"></div>
        <div><label style="margin-top:0">Horas</label><input type="number" id="dH" min="0" value="0" inputmode="numeric"></div>
        <div><label style="margin-top:0">Min</label><input type="number" id="dM" min="0" value="30" inputmode="numeric"></div>
        <div><label style="margin-top:0">Seg</label><input type="number" id="dS" min="0" value="0" inputmode="numeric"></div>
      </div>
      <div class="chips" style="margin-top:10px">
        <button data-q="300">5 min</button><button data-q="900">15 min</button><button data-q="1800">30 min</button><button data-q="3600">1 h</button><button data-q="86400">1 día</button>
      </div>
    </div>

    <label>Ícono o imagen</label>
    <div class="chips emojis" id="emojis"></div>
    <div class="imgpick">
      <button type="button" id="btnImg">🖼 Elegir imagen de mi galería</button>
      <input type="file" id="fImg" accept="image/*" hidden>
      <div id="imgPrev" style="display:none"><img id="imgThumb" alt=""><button type="button" id="btnImgX">Quitar imagen</button></div>
    </div>

    <label>Color</label>
    <div class="chips colors" id="colors"></div>

    <label>Sonido al terminar</label>
    <div class="sndrow">
      <button type="button" id="btnSnd">🎵 Elegir sonido</button>
      <button type="button" id="btnSndTest">▶</button>
      <button type="button" id="btnSndX">✕</button>
    </div>
    <input type="file" id="fSnd" accept="audio/*" hidden>
    <div class="hint" id="sndName"></div>

    <button class="save" id="btnSave">Guardar</button>
    <button class="cancel" id="btnCancel">Cancelar</button>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'falta_items_v1';
  const EMOJIS = ['⏳','🎬','📦','💼','🎂','✈️','🙏','📞','💰','🛒','🥟','🎓'];
  const COLORS = ['#ff5a3c','#ffb02e','#35d07f','#2fb5ff','#8b6bff','#ff4fa3'];
  let items = [];
  let editing = null, selEmoji = EMOJIS[0], selColor = COLORS[0], mode = 'date';
  let swReg = null;
  const fired = new Set();

  try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { items = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){ alert('No hay espacio para guardar. Prueba con una imagen más pequeña o borra alguna cuenta.'); } };

  /* ---------- Instalar como app + service worker ---------- */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(async () => { swReg = await navigator.serviceWorker.ready; }).catch(()=>{});
  }

  /* ---------- Utilidades ---------- */
  const pad = n => String(n).padStart(2,'0');
  function parts(ms) {
    let s = Math.floor(Math.abs(ms)/1000);
    const d = Math.floor(s/86400); s%=86400;
    const h = Math.floor(s/3600); s%=3600;
    const m = Math.floor(s/60); s%=60;
    return {d,h,m,s};
  }
  const txt = ms => { const p = parts(ms); return `${p.d}d ${pad(p.h)}h ${pad(p.m)}m ${pad(p.s)}s`; };
  const fmtWhen = t => new Date(t).toLocaleString('es-BO',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  /* ---------- Notificaciones ---------- */
  const permOK = () => 'Notification' in window && Notification.permission === 'granted';
  function updateBanner() {
    const can = 'Notification' in window;
    $('#banner').style.display = (can && Notification.permission === 'default') ? 'block' : 'none';
    $('#btnBell').textContent = permOK() ? '🔔' : '🔕';
  }
  async function askPerm() {
    if (!('Notification' in window)) { alert('Este navegador no soporta notificaciones. Prueba con Chrome.'); return false; }
    const r = await Notification.requestPermission();
    updateBanner();
    return r === 'granted';
  }
  async function show(title, body, tag, extra = {}) {
    if (!permOK()) return;
    const opts = Object.assign({ body, tag, silent:true, renotify:false, icon:undefined }, extra);
    try {
      const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
      if (reg && reg.active) { await reg.showNotification(title, opts); return; }
    } catch(e){}
    try { new Notification(title, opts); } catch(e){}
  }
  function closeNotif(tag) {
    try { (swReg ? swReg.getNotifications({tag}) : Promise.resolve([])).then(a => a.forEach(n => n.close())); } catch(e){}
  }
  function beep() {
    try {
      const a = new (window.AudioContext||window.webkitAudioContext)();
      [0,0.25,0.5].forEach(t => {
        const o = a.createOscillator(), g = a.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(.25, a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+t+.2);
        o.start(a.currentTime+t); o.stop(a.currentTime+t+.22);
      });
    } catch(e){}
    try { navigator.vibrate && navigator.vibrate([300,150,300,150,600]); } catch(e){}
  }

  /* ---------- Dibujo ---------- */
  function cardHTML(it, big) {
    const left = it.t - Date.now();
    const done = left <= 0;
    const p = parts(left);
    const pct = done ? 100 : Math.min(100, Math.max(0, (Date.now() - it.c) / (it.t - it.c) * 100));
    return `<div class="card ${big?'big':''} ${done?'done':''}" data-id="${it.id}" style="--c:${it.col}">
      ${it.img?`<div class="bgimg" style="background-image:url(${it.img})"></div>`:''}
      <div class="top">${it.img?`<img class="thumb" src="${it.img}" alt="">`:`<span class="emoji">${it.e}</span>`}<span class="name">${esc(it.n)}</span></div>
      <div class="when">${fmtWhen(it.t)}</div>
      ${done ? '<span class="badge">¡LLEGÓ LA HORA!</span>' : ''}
      <div class="clock">
        <div class="u"><b data-k="d">${done?'0':p.d}</b><small>días</small></div>
        <div class="u"><b data-k="h">${done?'00':pad(p.h)}</b><small>horas</small></div>
        <div class="u"><b data-k="m">${done?'00':pad(p.m)}</b><small>min</small></div>
        <div class="u"><b data-k="s">${done?'00':pad(p.s)}</b><small>seg</small></div>
      </div>
      <div class="bar"><i data-k="bar" style="width:${pct}%"></i></div>
      <div class="acts">
        ${done ? `<button data-a="done" class="on">✅ Completada</button><button data-a="restart">🔁</button>` : `<button data-a="pin" class="${it.pin?'on':''}">${it.pin?'📌 Fijada':'📌 Fijar'}</button><button data-a="float" class="${floatIds.has(it.id)?'on':''}">${floatIds.has(it.id)?'🪟 Flotando':'🪟 Flotar'}</button>`}
        <button data-a="edit">✏️</button>
        <button data-a="del">🗑</button>
      </div>
    </div>`;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function miniHTML(it) {
    return `<div class="mini" data-id="${it.id}" style="--c:${it.col}">
      ${it.img?`<img class="thumb" src="${it.img}" alt="">`:`<span class="emoji" style="font-size:24px">${it.e}</span>`}
      <div class="mn"><b>${esc(it.n)}</b><small>${fmtWhen(it.t)}</small></div>
      <button data-a="restart" title="Repetir">🔁</button><button data-a="del">🗑</button></div>`;
  }
  function render() {
    const el = $('#list');
    const act = items.filter(i => !i.arch), arc = items.filter(i => i.arch);
    let html = '';
    if (!act.length && !arc.length) {
      html = '<div class="empty"><div class="e">⏳</div><p>Aún no tienes cuentas regresivas.<br>Toca <b>+</b> para crear la primera.</p></div>';
    } else {
      const sorted = [...act].sort((a,b) => {
        const da = a.t < Date.now(), db = b.t < Date.now();
        return da === db ? a.t - b.t : (da ? 1 : -1);
      });
      html = sorted.map((it,i) => cardHTML(it, i===0)).join('');
      if (arc.length) html += `<details class="arch"><summary>✅ Completadas (${arc.length})</summary>${arc.map(miniHTML).join('')}</details>`;
    }
    const open = el.querySelector('details.arch[open]');
    el.innerHTML = html;
    if (open) { const d = el.querySelector('details.arch'); if (d) d.open = true; }
  }

  /* ---------- Tic cada segundo ---------- */
  function tick() {
    const now = Date.now();
    let rerender = false;
    items.forEach(it => {
      const left = it.t - now;
      const card = document.querySelector(`.card[data-id="${it.id}"]`);
      if (left > 0 && card) {
        const p = parts(left);
        card.querySelector('[data-k=d]').textContent = p.d;
        card.querySelector('[data-k=h]').textContent = pad(p.h);
        card.querySelector('[data-k=m]').textContent = pad(p.m);
        card.querySelector('[data-k=s]').textContent = pad(p.s);
        card.querySelector('[data-k=bar]').style.width = Math.min(100,(now-it.c)/(it.t-it.c)*100)+'%';
        if (it.pin) show(`${it.e} ${it.n}`, `Faltan ${txt(left)} · termina ${new Date(it.t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}`, 'pin-'+it.id, { requireInteraction:true, icon: it.img || undefined, data:{ pin:1, t:it.t, n:it.n, e:it.e } });
      }
      if (left <= 0 && !it.done) {
        it.done = true; rerender = true; save();
        closeNotif('pin-'+it.id);
        if (!fired.has(it.id)) {
          fired.add(it.id);
          startAlarm(it);
          show(`${it.e} ¡Llegó la hora!`, it.n, 'end-'+it.id, { silent:false, vibrate:[1000,300,1000,300,1000,300,1500], requireInteraction:true, icon: it.img || undefined });
        }
      }
    });
    if (rerender) render();
    if (floatIds.size) drawFloat();
    alarming.forEach((t0, id) => { if (now - t0 > 180000) alarming.delete(id); });
    if (alarming.size) {
      if (now - lastVib > 4000) { lastVib = now; try { navigator.vibrate && navigator.vibrate([1000,300,1000,300,1000]); } catch (e) {} }
      if (now - lastNote > 20000) {
        lastNote = now;
        alarming.forEach((t0, id) => { const i = items.find(x => x.id === id); if (i) show(`${i.e} ¡Llegó la hora!`, i.n, 'end-'+id, { silent:false, renotify:true, vibrate:[1000,300,1000,300,1000,300,1500], requireInteraction:true, icon: i.img || undefined }); });
      }
    }
    if (!alarming.size && !alarm.paused) { alarm.pause(); updateAlarmBar(); }
    document.title = (() => {
      const next = items.filter(i => i.t > now).sort((a,b)=>a.t-b.t)[0];
      return next ? `${txt(next.t-now)} · FALTA` : 'FALTA';
    })();
  }
  /* ---------- Ventana flotante (Picture-in-Picture) con varias cuentas ---------- */
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 360;
  const cx = cv.getContext('2d');
  const floatIds = new Set(); const imgCache = {};
  let gen = null, fw = null;
  function getImg(src) {
    if (!src) return null;
    if (!imgCache[src]) { const i = new Image(); i.src = src; imgCache[src] = i; }
    return imgCache[src].complete ? imgCache[src] : null;
  }
  function pushFrame() {
    if (!fw) return;
    try { fw.write(new VideoFrame(cv, { timestamp: Math.round(performance.now() * 1000) })).catch(() => {}); } catch (e) {}
  }
  function drawFloat() {
    if (!cx) return;
    const list = [...floatIds].map(id => items.find(x => x.id === id)).filter(Boolean).sort((a,b) => a.t - b.t);
    const W = 640, H = 360, now = Date.now();
    cx.fillStyle = '#0b0d14'; cx.fillRect(0, 0, W, H);
    cx.textBaseline = 'middle';
    if (list.length === 1) {
      const it = list[0], left = it.t - now, done = left <= 0, p = parts(left);
      const g = cx.createLinearGradient(0, 0, W, H); g.addColorStop(0, it.col); g.addColorStop(1, '#0b0d14');
      cx.globalAlpha = .75; cx.fillStyle = g; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1;
      const im = getImg(it.img);
      if (im) { const m = Math.min(im.width, im.height); cx.globalAlpha = .35; cx.drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, 0, (H-W)/2, W, W); cx.globalAlpha = 1; }
      cx.fillStyle = 'rgba(0,0,0,.35)'; cx.fillRect(0, 0, W, H);
      cx.textAlign = 'center'; cx.fillStyle = '#fff';
      let label = (im ? '' : it.e + ' ') + it.n;
      cx.font = 'bold 38px system-ui, sans-serif';
      while (cx.measureText(label).width > W - 40 && label.length > 4) label = label.slice(0, -2);
      cx.fillText(label, W/2, 52);
      if (done) {
        cx.fillStyle = '#35d07f'; cx.font = 'bold 74px system-ui, sans-serif'; cx.fillText('¡LLEGÓ LA HORA!', W/2, H/2 + 10);
      } else {
        cx.font = 'bold 34px system-ui, sans-serif'; cx.fillStyle = 'rgba(255,255,255,.85)';
        cx.fillText(p.d > 0 ? `${p.d} ${p.d === 1 ? 'día' : 'días'}` : 'faltan', W/2, 112);
        cx.fillStyle = '#fff'; cx.font = 'bold 118px ui-monospace, Menlo, Consolas, monospace';
        cx.fillText(`${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`, W/2, 205);
        cx.font = '26px system-ui, sans-serif'; cx.fillStyle = 'rgba(255,255,255,.7)';
        cx.fillText('horas   ·   minutos   ·   segundos', W/2, 285);
      }
    } else if (list.length > 1) {
      const top = 10, bottom = 34, rh = (H - top - bottom) / list.length;
      list.forEach((it, i) => {
        const y = top + i*rh, left = it.t - now, done = left <= 0, p = parts(left);
        cx.fillStyle = 'rgba(255,255,255,.08)'; cx.fillRect(12, y+3, W-24, rh-6);
        cx.fillStyle = it.col; cx.fillRect(12, y+3, 8, rh-6);
        const fs = Math.min(46, rh*.42); let x = 34;
        const im = getImg(it.img);
        if (im) { const s = rh - 14, m = Math.min(im.width, im.height); cx.drawImage(im, (im.width-m)/2, (im.height-m)/2, m, m, x, y+7, s, s); x += s + 10; }
        else { cx.font = `${fs}px system-ui, sans-serif`; cx.textAlign = 'left'; cx.fillStyle = '#fff'; cx.fillText(it.e, x, y + rh/2); x += fs + 12; }
        const ts = done ? '¡LISTO!' : `${p.d > 0 ? p.d + 'd ' : ''}${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`;
        cx.font = `bold ${fs}px ui-monospace, Menlo, Consolas, monospace`;
        const tw = cx.measureText(ts).width;
        cx.textAlign = 'right'; cx.fillStyle = done ? '#35d07f' : '#fff'; cx.fillText(ts, W-26, y + rh/2);
        let nm = it.n; const nf = Math.min(32, rh*.34);
        cx.font = `bold ${nf}px system-ui, sans-serif`;
        const maxw = W - 26 - tw - x - 14; let cut = false;
        while (cx.measureText(nm).width > maxw && nm.length > 2) { nm = nm.slice(0, -1); cut = true; }
        cx.textAlign = 'left'; cx.fillStyle = '#fff'; cx.fillText(cut ? nm + '…' : nm, x, y + rh/2);
      });
    }
    cx.textAlign = 'center'; cx.font = 'bold 20px system-ui, sans-serif'; cx.fillStyle = 'rgba(255,255,255,.55)'; cx.fillText('FALTA', W/2, H - 18);
    pushFrame();
  }
  function setupStream() {
    const v = $('#pipv'); if (v.srcObject) return;
    try {
      if (window.MediaStreamTrackGenerator && window.VideoFrame) {
        gen = new MediaStreamTrackGenerator({ kind: 'video' });
        fw = gen.writable.getWriter();
        v.srcObject = new MediaStream([gen]); return;
      }
    } catch (e) { fw = null; gen = null; }
    v.srcObject = cv.captureStream(10);
  }
  async function openPip() {
    if (!document.pictureInPictureEnabled) { alert('Tu navegador no permite la ventana flotante. Usa Chrome actualizado.'); floatIds.clear(); render(); return; }
    const v = $('#pipv');
    try {
      setupStream(); drawFloat(); setTimeout(drawFloat, 120);
      await v.play();
      if (document.pictureInPictureElement !== v) await v.requestPictureInPicture();
    } catch (e) { alert('No se pudo abrir la ventana flotante: ' + (e && e.message || e)); floatIds.clear(); render(); }
  }
  async function toggleFloat(it) {
    if (floatIds.has(it.id)) {
      floatIds.delete(it.id);
      if (!floatIds.size) { try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); } catch (e) {} }
      else drawFloat();
      render(); return;
    }
    floatIds.add(it.id); render();
    if (document.pictureInPictureElement) drawFloat(); else await openPip();
  }
  $('#pipv').addEventListener('leavepictureinpicture', () => { floatIds.clear(); render(); });
  $('#btnFloatAll').onclick = async () => {
    const act = items.filter(i => !i.arch && i.t > Date.now());
    if (!act.length) { alert('No hay cuentas activas para flotar.'); return; }
    act.forEach(i => floatIds.add(i.id)); render();
    if (document.pictureInPictureElement) drawFloat(); else await openPip();
  };
  try { navigator.mediaSession.setActionHandler('enterpictureinpicture', () => { if (floatIds.size) openPip(); }); } catch (e) {}

  /* ---------- Alarma con sonido propio (suena fuerte, en bucle) ---------- */
  const idb = new Promise((res, rej) => { try { const r = indexedDB.open('falta-snd', 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  idb.catch(() => {});
  const idbPut = (k, v) => idb.then(d => new Promise((res, rej) => { const t = d.transaction('s','readwrite'); t.objectStore('s').put(v, k); t.oncomplete = res; t.onerror = rej; }));
  const idbGet = k => idb.then(d => new Promise(res => { const q = d.transaction('s').objectStore('s').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); })).catch(() => null);
  const idbDel = k => idb.then(d => new Promise(res => { const t = d.transaction('s','readwrite'); t.objectStore('s').delete(k); t.oncomplete = res; t.onerror = res; })).catch(() => {});
  function makeWav() {
    const sr = 22050, n = Math.floor(sr * 1.6), buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
    for (let i = 0; i < n; i++) {
      const t = i/sr, slot = t % .5, on = slot < .28 && t < 1.5, f = slot < .14 ? 1046 : 1318;
      v.setInt16(44+i*2, on ? (Math.sin(2*Math.PI*f*t) > 0 ? 1 : -1) * .9 * 32767 : 0, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  const defaultWavUrl = makeWav();
  const alarm = new Audio(); alarm.loop = true; alarm.volume = 1;
  const alarming = new Map();
  let lastVib = 0, lastNote = 0;
  function updateAlarmBar() {
    const bar = $('#alarmBar');
    if (!alarming.size) { bar.classList.remove('show'); return; }
    const names = [...alarming.keys()].map(id => { const i = items.find(x => x.id === id); return i ? i.e + ' ' + i.n : ''; }).filter(Boolean).join(', ');
    $('#alarmTxt').textContent = '¡Llegó la hora! ' + names;
    bar.classList.add('show');
  }
  async function startAlarm(it) {
    alarming.set(it.id, Date.now());
    if (alarm.paused) {
      let url = defaultWavUrl;
      if (it.snd) { try { const b = await idbGet(it.id); if (b) url = URL.createObjectURL(b); } catch (e) {} }
      alarm.src = url; alarm.volume = 1;
      try { await alarm.play(); } catch (e) {}
    }
    updateAlarmBar();
    lastVib = 0; lastNote = Date.now();
  }
  function stopAlarm(id) {
    if (id) alarming.delete(id); else alarming.clear();
    if (!alarming.size) { try { alarm.pause(); alarm.currentTime = 0; } catch (e) {} try { navigator.vibrate && navigator.vibrate(0); } catch (e) {} }
    updateAlarmBar();
  }
  $('#alarmStop').onclick = () => stopAlarm();

  /* Reloj que no se duerme: un Worker marca cada segundo aunque la app esté en segundo plano */
  try {
    const w = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(1),1000)'], { type: 'text/javascript' })));
    w.onmessage = () => tick();
  } catch (e) { setInterval(tick, 1000); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  /* ---------- Formulario ---------- */
  function buildPickers() {
    $('#emojis').innerHTML = EMOJIS.map(e => `<button data-e="${e}" class="${e===selEmoji?'on':''}">${e}</button>`).join('');
    $('#colors').innerHTML = COLORS.map(c => `<button data-c="${c}" style="background:${c}" class="${c===selColor?'on':''}"></button>`).join('');
  }
  $('#emojis').onclick = e => { const b = e.target.closest('button'); if (!b) return; selEmoji = b.dataset.e; buildPickers(); };
  $('#colors').onclick = e => { const b = e.target.closest('button'); if (!b) return; selColor = b.dataset.c; buildPickers(); };

  function setMode(m) {
    mode = m;
    $('#tabDate').classList.toggle('on', m==='date');
    $('#tabDur').classList.toggle('on', m==='dur');
    $('#boxDate').style.display = m==='date' ? 'block' : 'none';
    $('#boxDur').style.display = m==='dur' ? 'block' : 'none';
  }
  $('#tabDate').onclick = () => setMode('date');
  $('#tabDur').onclick = () => setMode('dur');
  $('#boxDur').onclick = e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    const q = +b.dataset.q, p = parts(q*1000);
    $('#dD').value = p.d; $('#dH').value = p.h; $('#dM').value = p.m; $('#dS').value = p.s;
  };

  /* ---------- Sonido personalizado en el formulario ---------- */
  let sndBlob = null, sndName = '', sndRemoved = false, prev = null;
  function showSnd() { $('#sndName').textContent = sndName || 'Sonido por defecto (alarma fuerte)'; }
  function stopPreview() { if (prev) { try { prev.pause(); } catch (e) {} prev = null; } }
  $('#btnSnd').onclick = () => $('#fSnd').click();
  $('#fSnd').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    if (f.size > 8*1024*1024) { alert('Ese sonido pesa demasiado (máximo 8 MB).'); return; }
    sndBlob = f; sndName = '🎵 ' + f.name; sndRemoved = false; showSnd();
  };
  $('#btnSndX').onclick = () => { sndBlob = null; sndName = ''; sndRemoved = true; showSnd(); stopPreview(); };
  $('#btnSndTest').onclick = async () => {
    if (prev) { stopPreview(); return; }
    let b = sndBlob;
    if (!b && editing && !sndRemoved) b = await idbGet(editing);
    prev = new Audio(b ? URL.createObjectURL(b) : defaultWavUrl); prev.volume = 1;
    prev.play().catch(() => {}); setTimeout(stopPreview, 4000);
  };

  /* ---------- Imagen de la galería + colores automáticos ---------- */
  let selImg = null;
  function showPrev() {
    $('#imgPrev').style.display = selImg ? 'flex' : 'none';
    if (selImg) $('#imgThumb').src = selImg;
    $('#btnImg').textContent = selImg ? '🖼 Cambiar imagen' : '🖼 Elegir imagen de mi galería';
  }
  function dominantColor(img) {
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    const B = Array.from({length:12}, () => ({w:0,r:0,g:0,b:0}));
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b), v = mx/255, s = mx ? (mx-mn)/mx : 0;
      if (v < .2) continue;
      let hu = 0;
      if (mx !== mn) {
        if (mx === r) hu = ((g-b)/(mx-mn)) % 6; else if (mx === g) hu = (b-r)/(mx-mn) + 2; else hu = (r-g)/(mx-mn) + 4;
        hu = (hu*60 + 360) % 360;
      }
      const w = s*s*v + .001, k = B[Math.floor(hu/30)%12];
      k.w += w; k.r += r*w; k.g += g*w; k.b += b*w;
    }
    let best = B[0]; B.forEach(k => { if (k.w > best.w) best = k; });
    let r = best.r/best.w, g = best.g/best.w, b = best.b/best.w;
    const mx = Math.max(r,g,b);
    if (mx < 150) { const f = 150/Math.max(mx,1); r = Math.min(255,r*f); g = Math.min(255,g*f); b = Math.min(255,b*f); }
    return '#' + [r,g,b].map(n => Math.round(n).toString(16).padStart(2,'0')).join('');
  }
  function processFile(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = rej;
      fr.onload = () => {
        const im = new Image();
        im.onerror = rej;
        im.onload = () => {
          const S = 480, c = document.createElement('canvas'); c.width = c.height = S;
          const m = Math.min(im.width, im.height), sx = (im.width-m)/2, sy = (im.height-m)/2;
          c.getContext('2d').drawImage(im, sx, sy, m, m, 0, 0, S, S);
          const url = c.toDataURL('image/jpeg', .75);
          const t = new Image(); t.onload = () => res({ url, color: dominantColor(t) }); t.src = url;
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  $('#btnImg').onclick = () => $('#fImg').click();
  $('#fImg').onchange = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const r = await processFile(f);
      selImg = r.url; selColor = r.color; buildPickers(); showPrev();
    } catch(err) { alert('No pude leer esa imagen. Prueba con otra.'); }
  };
  $('#btnImgX').onclick = () => { selImg = null; showPrev(); };

  function openSheet(it) {
    editing = it ? it.id : null;
    $('#sheetTitle').textContent = it ? 'Editar' : 'Nueva cuenta regresiva';
    $('#fName').value = it ? it.n : '';
    selEmoji = it ? it.e : EMOJIS[0];
    selColor = it ? it.col : COLORS[0];
    selImg = it ? (it.img || null) : null; showPrev();
    sndBlob = null; sndRemoved = false; sndName = (it && it.snd) ? '🎵 ' + (it.sndName || 'sonido guardado') : ''; showSnd(); stopPreview();
    const d = new Date(it ? it.t : Date.now() + 86400000);
    $('#fDate').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    $('#fTime').value = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    setMode('date');
    buildPickers();
    $('#sheet').classList.add('show');
  }
  const closeSheet = () => $('#sheet').classList.remove('show');
  $('#fab').onclick = () => { openSheet(null); if ('Notification' in window && Notification.permission==='default') {} };
  $('#btnCancel').onclick = closeSheet;
  $('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };

  $('#btnSave').onclick = () => {
    const name = $('#fName').value.trim();
    if (!name) { $('#fName').focus(); return; }
    let target;
    if (mode === 'date') {
      if (!$('#fDate').value) { $('#fDate').focus(); return; }
      target = new Date(`${$('#fDate').value}T${$('#fTime').value || '00:00'}`).getTime();
    } else {
      const sec = (+$('#dD').value||0)*86400 + (+$('#dH').value||0)*3600 + (+$('#dM').value||0)*60 + (+$('#dS').value||0);
      if (sec <= 0) { alert('Pon una duración mayor a cero.'); return; }
      target = Date.now() + sec*1000;
    }
    if (isNaN(target)) { alert('Fecha no válida.'); return; }
    if (editing) {
      const it = items.find(x => x.id === editing);
      Object.assign(it, { n:name, e:selEmoji, col:selColor, img:selImg, t:target, done: target <= Date.now(), arch:false });
      fired.delete(it.id); stopAlarm(it.id);
    } else {
      items.push({ id: 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), n:name, e:selEmoji, col:selColor, img:selImg, t:target, c:Date.now(), pin:false, done:false });
    }
    const sid = editing || items[items.length-1].id, sit = items.find(x => x.id === sid);
    if (sndBlob) { idbPut(sid, sndBlob).catch(() => {}); sit.snd = true; sit.sndName = sndBlob.name; }
    else if (sndRemoved) { idbDel(sid); sit.snd = false; sit.sndName = ''; }
    save(); closeSheet(); render(); tick();
    if ('Notification' in window && Notification.permission === 'default') askPerm();
  };

  /* ---------- Acciones de tarjeta ---------- */
  $('#list').onclick = async e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const id = b.closest('[data-id]').dataset.id;
    const it = items.find(x => x.id === id);
    if (b.dataset.a === 'del') {
      if (!confirm('¿Borrar "' + it.n + '"?')) return;
      closeNotif('pin-'+id); stopAlarm(id); floatIds.delete(id); idbDel(id); items = items.filter(x => x.id !== id); save(); render();
    } else if (b.dataset.a === 'edit') {
      openSheet(it);
    } else if (b.dataset.a === 'float') {
      toggleFloat(it);
    } else if (b.dataset.a === 'done') {
      it.arch = true; it.pin = false; stopAlarm(id); floatIds.delete(id); closeNotif('pin-'+id); closeNotif('end-'+id); save(); render();
    } else if (b.dataset.a === 'restart') {
      let dur = it.t - it.c; if (!(dur >= 1000)) dur = 60000;
      it.c = Date.now(); it.t = it.c + dur; it.done = false; it.arch = false; fired.delete(id); stopAlarm(id); save(); render(); tick();
    } else if (b.dataset.a === 'pin') {
      if (!it.pin) {
        if (!permOK() && !(await askPerm())) return;
        it.pin = true; save(); render(); tick();
      } else {
        it.pin = false; closeNotif('pin-'+id); save(); render();
      }
    }
  };

  $('#btnPerm').onclick = askPerm;
  $('#btnBell').onclick = async () => {
    if (permOK()) show('🔔 FALTA', 'Las notificaciones están activas', 'test');
    else await askPerm();
  };

  /* ---------- Mensaje de instalar (10 s) ---------- */
  let deferred = null, insTimer = null;
  const ins = $('#install');
  function hideIns() { clearTimeout(insTimer); ins.classList.remove('show'); }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (sessionStorage.getItem('falta_ins_no')) return;
    ins.classList.add('show');
    const bar = $('#insBar'); bar.style.transition = 'none'; bar.style.width = '100%';
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = 'width 10s linear'; bar.style.width = '0'; }));
    insTimer = setTimeout(hideIns, 10000);
  });
  $('#insYes').onclick = async () => {
    hideIns();
    if (!deferred) return;
    deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred = null;
  };
  $('#insNo').onclick = () => { try { sessionStorage.setItem('falta_ins_no','1'); } catch(e){} hideIns(); };
  window.addEventListener('appinstalled', () => { hideIns(); deferred = null; });

  items.forEach(i => { if (i.t <= Date.now()) { i.done = true; fired.add(i.id); } });
  updateBanner(); render(); tick();
})();
</script>
